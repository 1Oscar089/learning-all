<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablas de Aprendizaje</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-emoji">📚</span>
          <div>
            <h1>Tablas de Aprendizaje</h1>
            <p class="subtitle">Crea temas, organiza tablas y aprende lo que quieras con soporte multilenguaje.</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="btnToggleKeyboard" class="btn btn-ghost" title="Mostrar/Ocultar Teclado Virtual">
            <span class="material-icons-round">keyboard</span>
            <span class="btn-text">Teclado Virtual</span>
          </button>
          <button id="btnNewTheme" class="btn btn-primary">
            <span class="material-icons-round">add</span> Nuevo tema
          </button>
          <a href="https://oscarmejia25.github.io/misnotas/" target="_blank"><button class="btn btn-primary>Apuntes</button></a>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="app-main">
      <!-- Vista de temas -->
      <section id="viewThemes" class="view active">
        <div id="emptyState" class="empty-state">
          <div class="empty-emoji">🗂️</div>
          <h2>Aún no hay temas</h2>
          <p>Crea tu primer tema para empezar a organizar tus tablas de aprendizaje.</p>
          <button class="btn btn-primary" onclick="document.getElementById('btnNewTheme').click()">Crear primer tema</button>
        </div>
        <div id="themesGrid" class="themes-grid"></div>
      </section>

      <!-- Vista de un tema -->
      <section id="viewTheme" class="view">
        <button class="btn btn-ghost back-btn" onclick="showThemes()">
          <span class="material-icons-round">arrow_back</span> Volver a temas
        </button>
        <div class="theme-header">
          <span id="themeEmoji" class="theme-emoji">📖</span>
          <h2 id="themeName">Tema</h2>
          <button class="btn btn-ghost btn-sm" onclick="editCurrentTheme()" title="Editar Tema">
            <span class="material-icons-round">edit</span>
          </button>
        </div>
        <div class="tables-section">
          <div class="tables-section-head">
            <h3>Tus Tablas</h3>
            <button id="btnNewTable" class="btn btn-primary">
              <span class="material-icons-round">add_circle</span> Nueva tabla
            </button>
          </div>
          <div id="tablesContainer" class="tables-container"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Teclado Virtual Avanzado / Multilenguaje -->
  <div id="virtualKeyboard" class="virtual-keyboard hidden">
    <div class="vk-header">
      <div class="vk-title-group">
        <span class="material-icons-round">language</span>
        <span class="vk-title">Símbolos e Idiomas</span>
      </div>
      <select id="vkLayoutSelect" class="vk-select">
        <optgroup label="Idiomas Asiáticos">
          <option value="japanese_hiragana">Japonés (Hiragana)</option>
          <option value="japanese_katakana">Japonés (Katakana)</option>
          <option value="chinese_common">Chino (Ideogramas comunes)</option>
          <option value="korean_hangul">Coreano (Hangul Jamo)</option>
        </optgroup>
        <optgroup label="Otros Idiomas y Fonética">
          <option value="arabic">Árabe</option>
          <option value="greek">Griego</option>
          <option value="cyrillic">Cirílico (Ruso)</option>
          <option value="ipa">IPA (Fonética)</option>
        </optgroup>
        <optgroup label="Ciencias y Acentos">
          <option value="math">Matemáticas y Lógica</option>
          <option value="accents">Acentos Especiales</option>
        </optgroup>
      </select>
      <div class="vk-drag-handle material-icons-round" title="Arrastrar teclado">drag_indicator</div>
      <button class="vk-close material-icons-round" onclick="toggleVirtualKeyboard()">close</button>
    </div>
    <!-- Buscador interno de símbolos rápidos -->
    <div class="vk-search-container">
      <span class="material-icons-round search-icon">search</span>
      <input type="text" id="vkSearchInput" placeholder="Buscar símbolo (ej: alfa, k, integral)..." />
    </div>
    <div id="vkKeysContainer" class="vk-keys"></div>
  </div>

  <!-- Modales y Toasts -->
  <div id="modalTheme" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>Nuevo tema</h3>
        <button class="modal-close" onclick="closeModal('modalTheme')">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Emoji</span>
          <input type="text" id="themeEmojiInput" maxlength="4" placeholder="📖" />
        </label>
        <label class="field">
          <span>Nombre del tema</span>
          <input type="text" id="themeNameInput" placeholder="Ej: Vocabulario Asiático" />
        </label>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('modalTheme')">Cancelar</button>
        <button class="btn btn-primary" onclick="createTheme()">Crear tema</button>
      </div>
    </div>
  </div>

  <div id="modalTable" class="modal-overlay" hidden>
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3>Nueva tabla</h3>
        <button class="modal-close" onclick="closeModal('modalTable')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <label class="field">
            <span>Título de la tabla</span>
            <input type="text" id="tableTitleInput" placeholder="Ej: Caracteres Básicos" />
          </label>
          <label class="field">
            <span>Número de columnas</span>
            <input type="number" id="tableColsInput" min="1" max="10" value="3" />
          </label>
        </div>
        <div class="field">
          <span>Encabezados (headers)</span>
          <div id="headersList" class="headers-list"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('modalTable')">Cancelar</button>
        <button class="btn btn-primary" onclick="createTable()">Crear tabla</button>
      </div>
    </div>
  </div>

  <div id="modalConfirm" class="modal-overlay" hidden>
    <div class="modal modal-sm">
      <div class="modal-head">
        <h3 id="confirmTitle">Confirmar</h3>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">¿Estás seguro?</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('modalConfirm')">Cancelar</button>
        <button class="btn btn-danger" id="confirmAccept">Aceptar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
